version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      vite-toolchain:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "vite-plugin-pwa"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      firebase-sdk:
        patterns:
          - "firebase"
          - "@firebase/*"
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    # Hold breaking major upgrades that require a deliberate, manual migration
    # rather than an automated bump. These were bundled into the dev-dependencies
    # group PR (#255) and broke CI. The Vite toolchain (vite 8, vitest 5,
    # @vitejs/plugin-react 6, vite-plugin-pwa 2) and jsdom 31 have since been
    # adopted on purpose, so their majors are no longer held: the toolchain's
    # move together through the vite-toolchain group above, and jsdom's open as
    # their own PR. firebase-admin 14 crosses a major boundary that is still
    # held here. TypeScript 7 is held at the root for a different reason: the
    # 7.0 package ships no JavaScript compiler API, and the root uses it
    # (scripts/e2e-functions-env.mjs and three specs call ts.createSourceFile),
    # so the root cannot take TypeScript 7 until it ships one. Dependabot still
    # proposes minor and patch updates for these packages; remove an entry here
    # when we are ready to adopt that major on purpose.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]

  # The worker/ manifest was outside every update lane: `directory: "/"` above
  # covers the app manifest only, so nothing proposed updates for
  # worker/package.json and nothing noticed when a transitive dependency there
  # went vulnerable. GHSA-g89c-p67h-r497 (sharp/libheif, high) sat open on
  # worker/package-lock.json for that reason; it is pinned exactly by miniflare
  # and so is not fixable by a bump today, but the next one that IS fixable
  # should reach a PR on its own rather than waiting for an alert sweep.
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
