name: synthetic-uptime

# Scheduled synthetic that asserts the DEPLOYED production surface is healthy —
# not merely that Firebase Hosting returns 200 for the shell (issue #142). The
# 2026-07-09 outage (#141) was invisible to a 200-only check: the shell +
# <title> loaded (200 OK) and only the client JS crashed on init
# (auth/invalid-api-key), leaving a blank page. This catches an outage from ANY
# cause (bad deploy, rotated key, rules regression that blocks first paint), not
# just a deploy — the post-deploy gate in scripts/deploy.sh covers the deploy
# path. Every spec under tests/synthetic runs: the app-mount probe
# (app-mounts.spec.ts) and the unsubscribe-endpoint probe
# (unsubscribe-invoker.spec.ts, #768). All are load-and-assert only: nothing
# signs in or writes, so there are no Auth/Firestore/Storage side effects.
#
# Failures surface as: a red workflow run, GitHub's scheduled-failure email, AND
# a single deduplicated tracking issue (opened on first failure, commented on
# continued failure, auto-closed on recovery).
#
# The tracking issue CARRIES THE FAILING TEST'S OWN DIAGNOSTIC (#768 r4). It
# used to hard-code the app-mount story — title "the app is not mounting", body
# advising that a rendering sign-in gate means the release is healthy. Once a
# second spec joined the suite that advice became actively misleading: an
# emailUnsubscribe 403 leaves the app rendering perfectly, so the boilerplate
# told the operator the release was fine and to go fix the probe, while every
# emailed unsubscribe link was broken. The title is now derived from which
# probe failed, and the Playwright output is quoted in the body so the
# instructions the spec itself prints reach the person triaging.

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

# Prevent overlapping runs from racing on the tracking issue.
concurrency:
  group: synthetic-uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  SYNTHETIC_URL: https://gaycruisebingo.com/
  ISSUE_LABEL: synthetic-uptime

jobs:
  synthetic:
    runs-on: ubuntu-latest
    # Bound the run so a hung npm ci / browser install can't hold the serialized
    # slot up to GitHub's 360-min default and starve the 15-min monitor cadence
    # (a real outage in that window would go unreported). A healthy run is ~2 min.
    timeout-minutes: 10
    steps:
      # persist-credentials: false so the issue:write repo token is NOT written
      # into the local git config where a compromised dependency lifecycle script
      # (npm ci below) could read it. The issue-update steps use an explicit
      # GH_TOKEN instead, so nothing here needs the persisted git credential.
      # Actions pinned to full-length commit SHAs (mutable tags could run with
      # this job's issues:write token if a tag/release were compromised).
      # checkout SHA matches the repo-standard pin; setup-node is the v4 ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Output is teed so the failure step below can quote Playwright's own
      # diagnostic. `pipefail` keeps npm's exit status rather than tee's, so
      # `continue-on-error` still sees a real failure.
      - name: Run synthetic probes
        id: synthetic
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:synthetic 2>&1 | tee "$RUNNER_TEMP/synthetic.log"

      # On FAILURE: open the tracking issue if none is open, else add a comment
      # to the existing one — so a continued outage stays a single issue.
      # Deduped by the ISSUE_LABEL (exact), which is created idempotently first.
      - name: Open or update failure issue
        if: steps.synthetic.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/synthetic.log"
          [ -f "$log" ] || : > "$log"

          # Name the failing surface so the title and the rollback advice match
          # what actually broke. emailUnsubscribe 403s while the app renders
          # perfectly, so the app-mount wording would send the operator the
          # wrong way entirely (#768 r4).
          if grep -q 'emailUnsubscribe 403' "$log"; then
            subject='the unsubscribe endpoint is returning 403'
            advice='**Do not roll back.** Rolling back Hosting does not touch Cloud Run IAM, so it cannot fix this. Restore the endpoint with `scripts/set-email-unsubscribe-invoker.sh` (idempotent), then re-run this workflow. See docs/app/phase-1-deploy.md § 1a-i.'
          elif grep -q 'served the SPA shell' "$log"; then
            subject='/unsubscribe is serving the app shell, not the opt-out page'
            advice='**Do not roll back.** The `/unsubscribe` Hosting rewrite is missing from the live release, so every emailed unsubscribe link opens the app. Confirm the rewrite is present and ordered before the `**` catch-all in `firebase.json`, then deploy Hosting (`npm run deploy:gaycruisebingo:hosting`).'
          else
            subject='the app is not mounting'
            advice="**Confirm before rolling back.** Open $SYNTHETIC_URL: if the sign-in gate renders, the PROBE failed and the release is healthy — do not roll back, fix the probe. If the page is blank or spins forever, it is a real outage: roll back per DEPLOYMENT.md § Rollback Procedure."
          fi

          # Quote the tail of the run. The specs print their own remediation
          # steps in the failure message, and that is the text worth carrying.
          # Capped so a pathological run cannot blow the issue-body limit.
          diagnostic="$(tail -c 4000 "$log")"

          gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Synthetic uptime check failure" --force
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')"

          body="$(printf 'The synthetic uptime check failed against %s: %s\n\nRun: %s\n\n%s\n\nThis issue auto-closes when a later run passes.\n\n<details><summary>Playwright output (tail)</summary>\n\n```\n%s\n```\n\n</details>' \
            "$SYNTHETIC_URL" "$subject" "$RUN_URL" "$advice" "$diagnostic")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing — $subject. $body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Synthetic uptime check failing: $subject" \
              --label "$ISSUE_LABEL" --body "$body"
          fi

      # On SUCCESS: if a tracking issue is open, comment recovery and close it.
      - name: Close failure issue on recovery
        if: steps.synthetic.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --reason completed \
              --comment "Recovered — every synthetic probe passes again. Run: ${RUN_URL}"
          fi

      # Make the run itself red so the Actions view and the scheduled-failure
      # email reflect the outage even though the issue step ran.
      - name: Reflect synthetic result in job status
        if: steps.synthetic.outcome == 'failure'
        run: |
          echo "Synthetic check failed — see the tracking issue and the step log above." >&2
          exit 1
