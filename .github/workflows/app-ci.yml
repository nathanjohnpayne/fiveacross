name: app-ci

# Runs the app test harness on every PR and on pushes to main: typecheck, the
# jsdom unit/component suite, the production build, the deployment safety
# harness, the Cloud Functions notifier suite (tests/functions/), the isolated
# registry publisher build, the Firestore/Storage security-rules suite against
# the emulators, and the offline-durability suite (tests/offline/) against the
# auth + firestore emulators. The Playwright e2e layer is a local smoke runner
# (`npm run test:e2e`) and is intentionally not run here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          # 22, not 20: react-router 8 declares `engines.node: >=22.22.0`, so a
          # Node 20 runner installs it under an EBADENGINE warning and runs the
          # jsdom suite on an engine the router does not support. 22 also lines
          # the runner up with the Cloud Functions runtime (functions/package.json
          # `engines.node: 22`) and the synthetic-uptime workflow.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The deploy-scope classifier (scripts/validate-firebase-deploy-filters.mjs)
      # rehearses predeploy hooks inside a platform write containment and
      # refuses the single-endpoint exemption fail-closed when it can prove
      # none. This runner could prove none: the image ships no `bwrap`, and
      # Ubuntu 24.04 keeps `kernel.apparmor_restrict_unprivileged_userns=1`, so
      # both `unshare` spellings die writing `/proc/self/uid_map`. Every case
      # that needs a predeploy hook to have RUN was therefore skipped here — in
      # the vitest suite under `npm test` and in `npm run test:deploy` alike —
      # which left the Linux `bwrap` nesting path exercised by no machine at
      # all (#1164).
      #
      # WHERE IT HAS TO SIT, pinned from both sides in
      # scripts/app-ci-write-containment.test.mjs. AFTER `Install dependencies`:
      # the probe imports the classifier, and that module's body resolves
      # `commander`, `typescript`, seven `firebase-tools/lib/*` entry points and
      # `portfinder` through `createRequire` before it exports anything, so on a
      # runner that has not run `npm ci` yet the probe and its retry both die
      # with MODULE_NOT_FOUND and the job ends before the first suite. AHEAD of
      # `npm test` and `npm run test:deploy`: those are the consumers whose
      # skips this step exists to lift. The root `npm ci` is the only install it
      # needs — the `--prefix` installs below belong to the Worker and the
      # registry publisher, neither of which the classifier loads.
      #
      # Two stages, because only the runner can settle which is needed: install
      # `bubblewrap`, then drop the AppArmor user-namespace restriction only if
      # the probe does not already name `bwrap`. Not "only if it proved
      # nothing" — a probe that named an `unshare` spelling instead has not
      # reached the path this step exists to reach, so it takes the second
      # stage too, and if the drop does not move the answer to `bwrap` the job
      # reds, which is the point. Ubuntu's own `bwrap-userns-restrict` profile
      # would be the narrower grant, but neither `apparmor` nor
      # `apparmor-profiles` ships it on noble, and hand-writing a policy that
      # unconfines `bwrap` is no narrower than the sysctl on a single-use VM.
      #
      # The check is `probeWriteContainment` itself rather than a stand-in, so
      # this asserts the very answer the suites go on to read, and it FAILS the
      # job rather than letting the skips return unnoticed. It insists on
      # `bwrap` by name and not merely on some mechanism: an `unshare` fallback
      # that quietly won instead would run the cases while leaving the `bwrap`
      # argv — the read-only checkout bound back over the writable set — as
      # untested as it was before. A later regression is read off the three
      # lines this prints: the `bwrap` version, the sysctl value, and the
      # mechanism the probe named.
      - name: Install bubblewrap (deploy-scope classifier write containment)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          echo "kernel.apparmor_restrict_unprivileged_userns = $(
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent
          )"
          probe() {
            CLASSIFIER="$PWD/scripts/validate-firebase-deploy-filters.mjs" \
              node --input-type=module -e '
                const { pathToFileURL } = await import("node:url");
                const { probeWriteContainment } = await import(
                  pathToFileURL(process.env.CLASSIFIER).href
                );
                const answer = await probeWriteContainment();
                console.log(
                  "write-containment probe: " + (answer.ok ? answer.label : answer.reason),
                );
                if (answer.label !== "bwrap") process.exit(1);
              '
          }
          if ! probe; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            probe
          fi

      # The registry publisher is deliberately a separate Functions Framework
      # codebase so its runtime dependency graph cannot inherit firebase-admin.
      - name: Install isolated registry publisher dependencies
        run: npm ci --prefix router-publisher

      - name: Verify isolated registry publisher dependency boundary
        run: npm run check:no-admin --prefix router-publisher

      # Miniflare stays in the Worker's separately installed dependency tree;
      # the root suite imports it for the registry's real-workerd test and for
      # the #1118 head-rewrite integration test (worker/src/routerHtmlHead.integration.test.ts).
      - name: Install isolated Event router dependencies
        run: npm ci --prefix worker

      - name: Verify generated registry harness capability types
        run: npm run check:registry-harness-types --prefix worker

      - name: Verify generated router capability types
        run: npm run check:router-types --prefix worker

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck isolated registry publisher
        run: npm run typecheck:router-publisher

      - name: Unit + component tests (jsdom)
        run: npm test

      # The production-origin integration seam (#965): a full
      # `vite build --mode production` under the real fiveacross deploy
      # environment plus the hostname-resolution boot. Its own layer and step,
      # separate from `npm test`, so the unit suite carries no hard dependency
      # on a working production build and a failure here names the layer.
      - name: Origin integration (production build seam)
        run: npm run test:origin

      - name: Build
        run: npm run build

      # Pure fixture repositories exercise the deploy wrapper's fail-closed
      # selection, readiness, and post-publish reconciliation paths. This stays
      # in app-ci (rather than the propagated repo-lint workflow) because both
      # the wrapper and its fixtures are Five Across application code.
      - name: Deployment safety harness
        run: npm run test:deploy

      # The runnable-JDK probe every emulator-booting script sources (#1018,
      # scripts/lib/ensure-java.sh). Its shell suite lives beside the deployment
      # harness above because both are bash fixtures; nothing else runs it, so a
      # regression in the probe would otherwise merge green.
      - name: Ensure-java probe suite
        run: npm run test:ensure-java

      # The Cloud Functions notifier suite (tests/functions/) imports
      # functions/src, whose resend / firebase-admin deps live only in
      # functions/package.json. `test:functions` runs `npm --prefix functions
      # install` first, so it is self-contained on a clean runner (no emulator).
      - name: Functions notifier tests
        run: npm run test:functions

      # The Firestore emulator is a Java process; rules tests boot it via
      # `firebase emulators:exec`. Java comes from setup-java; the Firebase
      # CLI is a devDependency (firebase-tools), so the `npm ci` above already
      # put the `firebase` binary on npm's script PATH.
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules tests (emulator)
        run: npm run test:rules

      # The offline-durability layer (ADR 0006): tests/offline/** drives a real
      # Firestore client under jsdom + fake-indexeddb against the auth +
      # firestore emulators — the ADR 0006 persistence proofs, Echo Marks
      # offline, the #457 cells-map merge, and the #387 / #409 regressions.
      # Until now nothing in CI ever executed it, so a regression against any of
      # those pins could merge green (#471).
      #
      # This step is deliberately SEPARATE from and AFTER the rules step, not
      # merged into it: each script owns its own `firebase emulators:exec`
      # invocation, and two emulator instances must never be live at once in one
      # job (they would contend for the same ports). Steps run sequentially, so
      # the rules emulator is fully torn down before this one boots.
      - name: Offline durability tests (emulator)
        run: npm run test:offline
