<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <!-- Edition-scoped at BUILD time and rewritten per hostname at the edge
         (#1118), because specs/w1-pwa.md requires this to equal the manifest's
         theme_color exactly and that value is per-Edition. The inline boot
         <style> below deliberately keeps one shared near-black: the edge
         rewrites attributes, not stylesheet text, and the three Editions'
         chrome colours differ by a few points of luminance. -->
    <meta name="theme-color" content="%EDITION_THEME_COLOR%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS home-screen label. Safari reads this, not the manifest's short_name
         (which Android uses, and which is deliberately shorter — #364), so the
         two platforms are set independently. Without this tag iOS would fall
         back to <title>, which happens to match today; it is set explicitly so
         retitling the page cannot silently rename the installed icon.

         Every Edition placeholder in this file is substituted at BUILD time
         from `VITE_EDITION` against the table in src/html-head-identity.ts
         (#586) — see `brandHtmlIdentity` in src/editions.ts and the
         `edition-html-identity` plugin in vite.config.ts, which fails the
         build if any one survives. They are not Vite's own env-substitution
         syntax: these are derived brand copy, not raw env values, and the
         plugin runs ahead of Vite's env replacement. A hostname-resolved build
         has no single Edition to bake, so the two chrome tags — this one and
         <title> — are corrected after resolution instead (editions.ts
         `applyEditionDocumentIdentity`), and every tag a crawler reads is
         rewritten per hostname at the edge (#1118).

         Deliberately not spelling a placeholder out in this comment: the
         fail-closed scan reads the whole file, comments included, so an example
         here would either break the build or ship as visible text. -->
    <meta name="apple-mobile-web-app-title" content="%EDITION_APP_NAME%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>%EDITION_DOCUMENT_TITLE%</title>
    <meta name="description" content="%EDITION_META_DESCRIPTION%" />

    <!-- Static default Open Graph for bare-URL unfurl (ADR 0005). No server-rendered
         per-share images — Share Cards are generated on-device (#36) and handed to
         the native share sheet instead.

         Edition-scoped at BUILD time like the chrome tags above (#587, artwork
         #609): crawlers do not run JS, so unlike the document title there is no
         runtime repair for these. A hostname-resolved bundle would therefore
         keep the default Edition's share block, which is why the edge Worker
         rewrites this whole block per hostname instead (#1118, the follow-up
         to #546: #546 shipped the per-host PWA manifest, which the Worker
         CONSTRUCTS, and left this block to the change that mutates a proxied
         HTML response). The rows the edge rewrites and the placeholders below
         are one table — src/html-head-identity.ts — so the build and the edge
         cannot brand different tags. og:url is the one value the edge does NOT
         take from the brand row: it emits the requested hostname's own origin,
         because the canonical URL of an unfurl is per-Event and a build can
         only bake per-Edition data. og:description stays static: it is the
         Edition-invariant tagline, shared verbatim by every brand row. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%EDITION_SHARE_NAME%" />
    <meta property="og:title" content="%EDITION_SHARE_NAME%" />
    <meta property="og:description" content="Sign in, get your card, mark it if you see it." />
    <meta property="og:url" content="%EDITION_OG_URL%" />
    <!-- og:image is an absolute URL on the serving project's always-healthy
         web.app host, never a custom-domain apex: the gcb apex TLS-resets for
         link crawlers (#340), which is exactly the fetch iMessage/WhatsApp/
         Telegram make to build a preview, and it is SNI-blocked on the ship
         network the app is used from (#164). og:url stays a serving origin on
         purpose — the brand row's canonical one in a baked build, the
         requested hostname's own at the edge. Both URLs live on the Edition's
         brand row (src/edition-brands.ts). -->
    <meta property="og:image" content="%EDITION_OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%EDITION_OG_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%EDITION_OG_IMAGE%" />
    <meta name="robots" content="noindex" />
    <!-- Inline on purpose: this paints before newly deployed hashed assets load. -->
    <style>
      html, body, #root { margin: 0; min-height: 100%; }
      html, body { background: #07060d; }
      .boot-loader {
        min-height: 100vh; display: grid; place-content: center; gap: 14px;
        color: #cfc7e8; background: #07060d; text-align: center;
        font: 600 15px/1.2 system-ui, sans-serif; letter-spacing: 0.04em;
      }
      .boot-loader-dots { display: flex; justify-content: center; gap: 7px; }
      .boot-loader-dots i {
        width: 9px; height: 9px; border-radius: 50%; background: #ff2d9b;
        animation: boot-pulse 1s ease-in-out infinite;
      }
      .boot-loader-dots i:nth-child(2) { animation-delay: 0.15s; }
      .boot-loader-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.75); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader-dots i { animation: none; opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <span class="boot-loader-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Opening your bingo card…</span>
      </div>
    </div>
    <!-- entry.tsx, not main.tsx: the handoff code has to leave the URL before
         anything that could observe a URL is loaded (#549). See src/entry.tsx. -->
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
