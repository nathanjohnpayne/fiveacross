# .repo-template.yml
#
# Per-repo overrides for CI lint scripts under scripts/ci/. Read by:
#   - scripts/ci/check_spec_test_alignment
#
# Keep this file small and only add entries when the default conventions
# (filename match of test against spec basename) don't cover the case.

# Map each spec_id (frontmatter or basename) to one or more test files.
# Used by check_spec_test_alignment when the default filename search
# wouldn't find the test.
spec_test_map:
  # event-scoped-client-state spans the shared key primitive, manual listener
  # lifecycles, Moment/retraction registries, and the two cross-tab intents; none
  # shares the spec basename, so map the contract's primary isolation suites.
  event-scoped-client-state:
    - src/data/eventScope.test.ts
    - src/data/currentEvent.test.ts
    - src/eventScopedAnalytics.test.ts
    - src/hooks/event-scope-lifecycle.test.tsx
    - src/data/moments-event-scope.test.ts
    - src/hooks/useOpenSquare.test.tsx
    - src/components/SuggestPanelBridge.test.tsx
    - src/App.test.tsx
    - src/auth/AuthContext.test.tsx
    - src/data/hearts-event-scope.test.ts
    - src/components/CoachOverlay.test.tsx
    - src/components/NoticeBanner.test.tsx
    - src/components/w1-profile-avatar.test.tsx
    - src/components/w2-share-cards.test.tsx
    - src/components/admin/adult-content-confirm.test.tsx
  # event-scoped-marker-delivery spans the client writers/listener, Security
  # Rules, retrying normalizer, migration, and the offline queue. Its tests are
  # deliberately layer-named, so the basename heuristic cannot discover them.
  event-scoped-marker-delivery:
    - src/data/w2-tally.test.ts
    - src/data/echo-marks.test.ts
    - src/data/w2-proof-capture.test.ts
    - src/hooks/d15-tally-cards.test.ts
    - tests/rules/marker-event-delivery.test.ts
    - tests/rules/membership-mark-batch-budget.test.ts
    - tests/functions/marker-event-identity.test.ts
    - scripts/migrate-marker-event-id.test.mjs
    - tests/offline/w2-tally.test.ts
  # auth-handoff-client's coverage is module-named (the mode/strategy table, the
  # transaction store, the boundary primitives, the two callable legs, the
  # client/server parity pin, the exact-session attestation bridge and provider
  # adoption, the central-origin page, the two new failure screens, the allowlist
  # entry for the central auth origin, the production target composition, and
  # its fail-closed deploy prerequisite), so none of them share the spec basename
  # — map them all explicitly.
  auth-handoff-client:
    - src/auth/authMode.test.ts
    - src/auth/handoffTransaction.test.ts
    - src/auth/handoffClient.test.ts
    - src/auth/handoffExchange.test.ts
    - src/auth/handoffCommitProtocol.test.ts
    - src/auth/handoffCommitClient.test.ts
    - src/auth/handoffCommitWorker.test.ts
    - src/auth/firebaseHandoffCommitWorkerAdapter.test.ts
    - src/auth/handoffIndexedDbProbe.test.ts
    - src/auth/handoffAttemptFence.test.ts
    - src/auth/handoffBrowserPrimitives.test.ts
    - src/auth/handoffSessionFingerprint.test.ts
    - src/auth/handoffPageAuthObserver.test.ts
    - src/auth/handoffReturnCoordinator.test.ts
    - src/auth/handoffReturn.test.ts
    - src/firebaseCore.test.ts
    - src/auth/handoffAttestation.test.ts
    - src/auth/AuthContext.test.tsx
    - src/auth/handoff-parity.test.ts
    - src/auth/AuthHandoffOrigin.test.tsx
    - src/components/event-not-found-auth-reasons.test.tsx
    - src/components/signin-handoff-route.test.tsx
    - src/handoffBoot.test.ts
    - tests/e2e/auth-handoff-worker.spec.ts
    - src/auth-domain.test.ts
    - scripts/fiveacross-origin.integration.test.mjs
    - scripts/deploy-target.test.mjs
    - scripts/deploy-main-guard.test.mjs
    - scripts/auth-handoff-deploy-readiness.test.mjs
    - tests/test_deploy.sh
  # event-membership's coverage is module-named: the pure admission predicates,
  # #1079's fail-closed Mark/Echo preview, and #804 deploy 1's switch freeze.
  # The full deployed Firestore admission inventory remains #804 deploy 2's and
  # Storage remains #806's, so map these prerequisite layers explicitly.
  # path-addressing-and-root is design-first; the one shipped seam is the
  # router's path-capability projection (#972), tested with the router.
  path-addressing-and-root:
    - worker/src/router.test.ts
    - worker/src/registry/routerRegistry.integration.test.ts
  event-membership:
    - src/data/eventMembership.test.ts
    - tests/rules/membership-mark-batch-budget.test.ts
    - tests/rules/membership-enforcement-freeze.test.ts
  # event-invitations spans the generated server authorization mirror, pure and
  # real-emulator transaction proofs, the pre-analytics browser capture, closed
  # client callables, recursive rules denial, and deployment IAM reconciliation.
  # Most tests are named for those seams rather than the spec basename.
  event-invitations:
    - tests/functions/event-invitations.test.ts
    - tests/rules/event-invitations.test.ts
    - tests/rules/event-invitations-core.test.ts
    - src/data/eventInvitations.test.ts
    - src/pendingEventInvitation.test.ts
    - src/urlFragment.test.ts
    - src/handoffBoot.test.ts
    - src/auth/handoffReturn.test.ts
    - src/auth/admissionCoordinator.test.ts
    - src/auth/admission-wiring.test.tsx
    - src/components/signin-invitation-handoff.test.tsx
    - src/components/signin-popup-failure.test.tsx
    - scripts/materialize-event-membership-functions.test.mjs
    - scripts/event-invitations-invoker.test.mjs
    - scripts/event-invitations-deploy.test.mjs
    - tests/test_deploy.sh
  # event-setup-wizard's coverage is module-named (the draft store seam, the
  # occasion matrix, and the shared validation predicates), so none of the
  # three share the spec basename — map them explicitly.
  event-setup-wizard:
    - src/data/eventDraft.test.ts
    - src/data/occasions.test.ts
    - src/data/draftValidation.test.ts
  # event-resolution's coverage is module-named across the client decision,
  # branding, production target/build composition, and authenticated predeploy
  # seams, so the tests do not share the spec basename — map them explicitly.
  event-resolution:
    - src/eventResolution.test.ts
    - src/data/hostnames.test.ts
    - src/editions.test.ts
    - src/components/signin-edition-brand.test.tsx
    - src/components/ErrorBoundary.test.tsx
    - src/auth-domain.test.ts
    - scripts/build-target.test.mjs
    - scripts/fiveacross-origin.integration.test.mjs
    - scripts/verify-deploy-hostnames.test.mjs
    - scripts/deploy-target.test.mjs
    - scripts/firebase/op-firebase-deploy.test.mjs
  # cells-map's pure boundary lives in src/game/cells.test.ts (module-named,
  # not spec-basename-named); the offline no-clobber proof matches by name.
  cells-map:
    - src/game/cells.test.ts
    - src/data/cellsMerge.test.ts
    - src/test/migrate-cells-map.test.ts
    - tests/offline/cells-map.test.ts
  # The test-harness spec spans four layers whose test filenames don't share
  # the spec basename, so map each layer's test explicitly.
  w0-test-harness:
    - src/game/logic.test.ts
    - src/test/rtl-smoke.test.tsx
    - tests/rules/firestore-harness.test.ts
    - tests/e2e/smoke.spec.ts
  # d15-day-switcher's coverage is component-named, not spec-basename-named
  # (the ticket's own "Tests to add" list), so map both explicitly.
  d15-day-switcher:
    - src/components/DaySwitcher.test.tsx
    - src/components/Board.test.tsx
  # d15-tutorial-banners's coverage is component-named, not spec-basename-
  # named (the spec's own "Test coverage" list), so map all three explicitly.
  d15-tutorial-banners:
    - src/components/TutorialBanner.test.tsx
    - src/components/DaySwitcher.test.tsx
    - src/components/Board.test.tsx
  # d15-text-size's coverage is feature-named per the ticket's own "Tests to
  # add" list (#215), not spec-basename-named, so map all four explicitly.
  d15-text-size:
    - src/game/fitText.test.ts
    - src/hooks/useTextSize.test.ts
    - src/components/Board.test.tsx
    - src/w2-ga4-events.test.tsx
  # d15-coach-overlay's coverage spans two files neither named for the spec.
  d15-coach-overlay:
    - src/components/CoachOverlay.test.tsx
    - src/components/d15-more-menu.test.tsx
  # d15-admin-proof-claims's coverage extends the existing Admin.test.tsx
  # (component-named, not spec-basename-named — the ticket's own "Tests to
  # add" list), so map it explicitly.
  d15-admin-proof-claims:
    - src/components/Admin.test.tsx
  # easy-mix spans the pure composition (game logic) and the scheduler/snapshot
  # side (a differently-named functions test), so map both explicitly.
  easy-mix:
    - src/game/easy-mix.test.ts
    - tests/functions/easy-mix-snapshot.test.ts
  # community-squares-quota spans the pure dealer, approval transaction,
  # approval UI, and real reshuffle path, so map each differently-named seam.
  community-squares-quota:
    - src/game/community-squares-quota.test.ts
    - src/data/community-prompt-targeting.test.ts
    - src/components/Admin.test.tsx
    - src/components/admin-async-feedback.test.tsx
    - src/data/reshuffle.test.ts
    - tests/rules/community-squares-quota.test.ts
  # admin-messages (Notices, #439) spans a rules block, the mergeFeed unit,
  # two player surfaces, and the admin door — none named for the spec
  # basename, so map each layer's test explicitly (the spec's own Tests list).
  admin-messages:
    - tests/rules/notices.test.ts
    - src/data/w2-feed-moments.test.ts
    - src/components/NoticeBanner.test.tsx
    - src/components/admin-console-ia.test.tsx
    - src/components/MessagesPanel.test.tsx
  # og-renderer-commit-safety's coverage lives under scripts/og/ as *.test.mjs
  # (module-named, not spec-basename-named, and outside both test_globs
  # patterns below), so map every layer explicitly.
  # event-router's coverage is module-named (the shared Slug contract, the
  # namespace guard, the lookup's decision table, the request pipeline, the
  # capability contract of its registry binding, and the guarded deploy) and
  # spans two top-level directories, so none of them share the spec basename —
  # map them all explicitly.
  event-router:
    - src/slug.test.ts
    - worker/src/host.test.ts
    - worker/src/resolve.test.ts
    - worker/src/router.test.ts
    - worker/src/config.test.ts
    - worker/src/index.test.ts
    - worker/src/routerBinding.test.ts
    - worker/src/manifest.test.ts
    - src/web-manifest.test.ts
    - src/sw-precache-audit.test.ts
    - scripts/worker-deploy.test.mjs
  # event-router-registry spans the control plane, the per-host Durable Object,
  # the signing/verification chain, the recovery and probe surfaces, and the
  # router's consumption of the named lookup entrypoint. Every file is
  # module-named and several are Miniflare integration suites, so none can be
  # discovered by the spec basename.
  event-router-registry:
    - worker/src/registry/contracts.test.ts
    - worker/src/registry/state.test.ts
    - worker/src/registry/storedState.test.ts
    - worker/src/registry/audit.test.ts
    - worker/src/registry/recovery.test.ts
    - worker/src/registry/recoveryHistory.test.ts
    - worker/src/registry/probe.test.ts
    - worker/src/registry/service.test.ts
    - worker/src/registry/controlService.test.ts
    - worker/src/registry/controlAuth.test.ts
    - worker/src/registry/oidc.test.ts
    - worker/src/registry/keys.test.ts
    - worker/src/registry/telemetry.test.ts
    - worker/src/registry/registryHarness.test.ts
    - worker/src/registry/registryWorker.contract.test.ts
    - worker/src/registry/registryWorkerSweep.test.ts
    - worker/src/registry/registryWorker.integration.test.ts
    - worker/src/registry/routerRegistry.integration.test.ts
    - worker/src/registry/privateTracer.integration.test.ts
    - worker/src/routerBinding.test.ts
  og-renderer-commit-safety:
    - scripts/og/og-size-guard.test.mjs
    - scripts/og/og-scratch-path.test.mjs
    - scripts/og/og-stage-commit.test.mjs
    - scripts/og/og-stage-commit-concurrency.test.mjs
    - scripts/og/og-commit-lock.test.mjs
    - scripts/og/og-commit-lock-atomicity.test.mjs
  # cloud-vision-moderation spans five layers — the hide decision (functions:
  # the arms themselves, the scanner hand-off that keeps a verdict reaching a
  # Proof that does not exist yet from creating one, and the block pinning that
  # the client acts on the server-owned marker rather than on the verdict), the
  # rules pins that adding a second server writer needed no client surface and
  # that the hand-off collection is server-to-server only, the client writes that
  # must not undo a safety hide (the confirm-time gate, the claim-aware Restore,
  # the hold-preserving Hide, and attachProof's write staying a plain create), the
  # queue row's reason/restore treatment, and the queue-membership arm that keeps
  # a restored Proof reachable. Only the first shares the spec basename's
  # discovery path, so map them all explicitly.
  cloud-vision-moderation:
    - tests/functions/cloud-vision-moderation.test.ts
    - tests/rules/cloud-vision-moderation.test.ts
    - src/data/cloud-vision-moderation.test.ts
    - src/components/admin/cloud-vision-moderation.test.tsx
    - src/hooks/cloud-vision-moderation.test.tsx
# Glob patterns that identify test files. Supplements the default
# ("tests/**/*.test.*") which doesn't cover shell-based tests or the
# Vite app's colocated unit tests under src/.
test_globs:
  - "tests/**"
  - "src/**/*.test.*"
  # The edge Event router's specs are colocated with its source under worker/
  # (#545), outside both patterns above.
  - "worker/**/*.test.ts"

# Top-level directories beyond the canonical set that are intentional in
# this repo: the Vite app's static-assets dir, and the separately deployed
# Cloudflare Worker Event router (#545). Justification per the Code
# Modification Rules lives in plans/app-scaffold-dirs.md for `public` and in
# AGENTS.md § Repository Layout for `worker` (this whitelist only silences
# the lint gate). `cloud-run` was dropped from this list when
# #39 (ADR 0005) removed the Cloud Run OG renderer, the directory's only
# occupant.
# Inline-array form because check_no_forbidden_top_level_dirs only
# recognizes `key: [a, b]`, not indented list items.
extra_top_level_dirs: [public, router-publisher, worker]
